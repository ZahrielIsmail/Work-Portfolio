<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Project Report Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
	<style>
	/* =========================
	Variables / Base
	========================= */
	:root {
	/* colors */
	--bg: #0f1724;
	--bg-2: #071028;
	--card: #0b1220;
	--accent: #4fd1c5;
	--muted: #9aa4b2;
	--text: #eef2f7;

	/* layout */
	--maxw: 1100px;
	--sidenav-w: 260px;
	--main-min: 720px;

	/* typography */
	--font-sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
	}

	* { box-sizing: border-box; }

	/* Page base */
	html, body {
	min-height: 100%;
	margin: 0;
	font-family: var(--font-sans);
	color: var(--text);
	background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;
	}
	


	/* Center page and add page padding */
	body {
	display: flex;
	justify-content: center;
	padding: 32px 12px;
	}

	/* =========================
	Layout: grid (sidenav + main)
	========================= */
	.site {
	width: 100%;
	max-width: var(--maxw);
	margin: 0 auto;
	display: grid;
	grid-template-columns: var(--sidenav-w) minmax(var(--main-min), 1fr);
	gap: 40px;
	align-items: start;
	}

	/* Header sits in the main column */
	header {
	grid-column: 2;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 16px;
	margin-bottom: 18px;
	}

	/* =========================
	Typography / small helpers
	========================= */
	h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
	.subtitle { color: var(--muted); margin-top: 6px; font-size: 13px; }
	.muted { color: var(--muted); font-size: 13px; }

	/* Links */
	a { color: var(--accent); text-decoration: none; }
	a:hover { text-decoration: underline; }

	/* =========================
	Card surface / components
	========================= */
	.card {
	background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
	border: 1px solid rgba(255,255,255,0.04);
	padding: 18px;
	border-radius: 12px;
	}

	.hero { display: flex; gap: 12px; align-items: center; }
	.cta {
	display: inline-block;
	background: var(--accent);
	color: #062027;
	padding: 8px 12px;
	border-radius: 8px;
	text-decoration: none;
	font-weight: 600;
	}

	/* Project grid/cards */
	.grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
	gap: 12px;
	margin-top: 12px;
	}

	.proj {
	padding: 12px;
	border-radius: 10px;
	background: rgba(255,255,255,0.01);
	border: 1px solid rgba(255,255,255,0.03);
	}

	/* Small inline tag */
	.tag {
	background: rgba(255,255,255,0.02);
	color: var(--muted);
	padding: 6px 8px;
	border-radius: 8px;
	font-size: 12px;
	margin-right: 6px;
	}

	/* =========================
	Side navigation (sitemap)
	========================= */
	.sidenav {
	position: sticky;
	top: 32px;
	height: calc(100vh - 64px);
	overflow: auto;
	padding: 12px;
	border-radius: 12px;
	align-self: start;

	/* subtle visual nudge to the left */
	transform: translateX(-12px);
	margin-left: -8px;
	}

	.sidenav h3 { margin: 0 0 10px 0; font-size: 15px; }
	.sitemap {
	list-style: none;
	padding: 0;
	margin: 0;
	font-size: 14px;
	color: var(--muted);
	}

	.sitemap li { margin: 6px 0; }

	.sitemap a {
	display: flex;
	justify-content: space-between;
	gap: 8px;
	padding: 8px;
	border-radius: 8px;
	color: var(--muted);
	}

	.sitemap a:hover {
	background: rgba(79,209,197,0.06);
	color: var(--accent);
	}

	.sitemap .sub { padding-left: 12px; font-size: 13px; color: #95a3af; }

	/* =========================
	Footer
	========================= */
	footer { margin-top: 18px; color: var(--muted); font-size: 13px; }

	/* =========================
		Responsive breakpoints
	========================= */
	@media (max-width: 880px) {
		.site {
			grid-template-columns: 1fr;
			padding-bottom: 18px;
		}

	/* Move sidenav below main on mobile and restore normal flow */
		.sidenav {
			order: 2;
			position: relative;
			top: auto;
			height: auto;
			margin-top: 12px;
			transform: none;
			margin-left: 0;
		}

	header { grid-column: 1; }
	}

	/* =========================
		Small utilities
	========================= */
	/* inline code style used in repro section */
		code {
		background: #071427;
		padding: 4px 6px;
		border-radius: 6px;
		color: #a8d9d4;
		font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Courier New", monospace;
		font-size: 13px;
	}

	img {
	  display: block;
	  margin: 0 auto;
	}

	</style>
</head>
<body>
  <div class="site">
    <div class="sidenav">
      <h3>Navigation</h3>
      <ul class="sitemap">
        <li><a href="index.html">← Back to Projects</a></li>
      </ul>
    </div>
    <main>
      <header>
        <h1>Project Report</h1>
      </header>
      <div id="content" class="card"></div>
    </main>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file');

    if (file) {
      fetch(file)
        .then(res => res.text())
        .then(md => {
          document.getElementById('content').innerHTML = marked.parse(md);
        })
        .catch(() => {
          document.getElementById('content').innerHTML = "<p>Error loading report.</p>";
        });
    } else {
      document.getElementById('content').innerHTML = "<p>No report specified.</p>";
    }
  </script>
</body>
</html>
